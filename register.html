<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Rise Edge Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="brand">
    <span class="logo">R</span>
    <span>Rise Edge Academy</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html" class="nav-button">Login</a>
  </nav>
</header>

<main class="section">

  <div class="card form-card">

    <h1>Create Account</h1>
    <p class="muted">Join Rise Edge Academy.</p>

    <!-- Account Type -->
    <label for="accountType">Account Type</label>

    <select id="accountType" required>
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
    </select>

    <form id="registerForm">

      <!-- Common Fields -->
      <input
        id="name"
        type="text"
        placeholder="Full name"
        required
      >

      <input
        id="email"
        type="email"
        placeholder="Email address"
        required
      >

      <!-- Student Fields -->
      <div id="studentFields">

        <input
          id="studentId"
          type="text"
          placeholder="Student ID"
        >

        <input
          id="className"
          type="text"
          placeholder="Class"
        >

        <input
          id="section"
          type="text"
          placeholder="Section"
        >

      </div>

      <!-- Teacher Fields -->
      <div id="teacherFields" style="display:none;">

        <input
          id="subject"
          type="text"
          placeholder="Subject"
        >

        <input
          id="qualification"
          type="text"
          placeholder="Qualification"
        >

      </div>

      <!-- Password -->
      <input
        id="password"
        type="password"
        placeholder="Password"
        minlength="6"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm password"
        minlength="6"
        required
      >

      <button
        class="button primary"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <p id="message" class="message"></p>

    <p class="center muted">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</main>

<script type="module" src="js/register.js"></script>

<script>
  const accountType = document.getElementById("accountType");
  const studentFields = document.getElementById("studentFields");
  const teacherFields = document.getElementById("teacherFields");

  accountType.addEventListener("change", () => {

    if (accountType.value === "teacher") {
      studentFields.style.display = "none";
      teacherFields.style.display = "block";

      document.getElementById("studentId").required = false;
      document.getElementById("className").required = false;
      document.getElementById("section").required = false;

      document.getElementById("subject").required = true;
      document.getElementById("qualification").required = true;

    } else {

      studentFields.style.display = "block";
      teacherFields.style.display = "none";

      document.getElementById("studentId").required = true;
      document.getElementById("className").required = true;
      document.getElementById("section").required = true;

      document.getElementById("subject").required = false;
      document.getElementById("qualification").required = false;
    }

  });
</script>

</body>
</html>
