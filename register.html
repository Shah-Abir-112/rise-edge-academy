<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | Rise Edge Academy</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">R</span>Rise Edge Academy</a>
<div class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span><h1>Register</h1><p class="muted">Create a student or teacher account.</p>
<form id="registerForm"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><label>Role<select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></label><button class="btn btn-primary full">Register</button></form><p class="auth-foot">Already registered? <a href="login.html">Sign in</a></p></div></main>
<script type="module" src="js/firebase/auth.js"></script></body></html>
