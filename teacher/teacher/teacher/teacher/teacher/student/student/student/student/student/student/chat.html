<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Chat - Rise Edge Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">Student Dashboard</a>
  <a href="../index.html">Home</a>
</header>

<main class="container">

  <h1>Chat with Teacher</h1>

  <div class="card">
    <h2>Messages</h2>

    <div id="chatMessages">
      No messages yet.
    </div>
  </div>

  <div class="card">

    <form id="chatForm">

      <input
        type="text"
        id="chatInput"
        placeholder="Type your message..."
        required
      >

      <button class="btn" type="submit">
        Send Message
      </button>

    </form>

  </div>

</main>

<script type="module" src="../js/chat.js"></script>

</body>
</html>
