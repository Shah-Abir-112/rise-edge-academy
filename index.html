<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Rise Edge Academy</title>

  <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="navbar">

  <a href="index.html" class="brand">

    <span class="brand-icon">R</span>

    <span>Rise Edge Academy</span>

  </a>

  <nav class="nav-links">

    <a href="index.html">Home</a>

    <a href="register.html" class="nav-register">
      Register
    </a>

  </nav>

</header>



<main class="container">


  <div
    class="card"
    style="
      max-width:480px;
      margin:80px auto;
      padding:35px;
    "
  >

    <h1>Welcome Back 👋</h1>

    <p
      style="
        color:#64748b;
        margin:10px 0 25px;
      "
    >
      Login to your Rise Edge Academy account.
    </p>


    <form id="loginForm">


      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
        autocomplete="email"
        required
      >


      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
        required
      >


      <button
        class="btn btn-primary"
        type="submit"
        style="width:100%;"
      >
        Login
      </button>


    </form>


    <p
      id="loginMessage"
      style="
        margin-top:15px;
        text-align:center;
      "
    ></p>


    <p
      style="
        margin-top:25px;
        text-align:center;
        color:#64748b;
      "
    >
      Don't have an account?

      <a href="register.html">
        Create account
      </a>

    </p>


  </div>


</main>



<!-- Firebase Login Script -->

<script
  type="module"
  src="js/login.js"
></script>


</body>

</html>
