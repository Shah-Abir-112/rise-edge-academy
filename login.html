<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Rise Edge Academy</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="index.html"><span class="brand-mark">R</span>Rise Edge Academy</a>
<div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="muted">Choose a portal to continue.</p>
<form id="loginForm"><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required placeholder="••••••••"></label>
<label>Portal<select id="portal"><option value="admin">Admin</option><option value="teacher">Teacher</option><option value="student">Student</option></select></label>
<button class="btn btn-primary full" type="submit">Sign In</button></form><p class="auth-foot">New here? <a href="register.html">Create an account</a></p></div></main>
<script type="module" src="js/firebase/auth.js"></script></body></html>
