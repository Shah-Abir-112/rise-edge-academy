<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rise Edge Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
  <a href="index.html" class="brand">
    <span class="brand-icon">R</span>
    <span>Rise Edge Academy</span>
  </a>

  <a href="index.html">Home</a>
</header>

<main class="container">

  <div class="card" style="max-width:480px;margin:70px auto;">

    <h1>Welcome Back 👋</h1>

    <p style="color:#64748b;margin:10px 0 25px;">
      Login to your Rise Edge Academy account.
    </p>

    <form id="loginForm">

      <input
        type="email"
        id="loginEmail"
        placeholder="Email address"
        required
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
      >

      <button
        class="btn btn-primary"
        type="submit"
      >
        Login
      </button>

    </form>

    <p id="loginMessage" style="margin-top:15px;"></p>

    <p style="margin-top:20px;text-align:center;">
      Don't have an account?
      <a href="register.html">Create account</a>
    </p>

  </div>

</main>

<script type="module">

import { signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import { auth }
from "./js/firebase-config.js";


console.log("Firebase login script loaded");


const form = document.getElementById("loginForm");

const message = document.getElementById("loginMessage");


form.addEventListener("submit", async (event) => {

  event.preventDefault();

  message.textContent = "Logging in...";

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  try {

    console.log("Trying login:", email);

    const userCredential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    console.log(
      "LOGIN SUCCESS:",
      userCredential.user.email
    );

    message.textContent = "Login successful!";

    // Temporary dashboard
    window.location.href = "student/index.html";

  } catch (error) {

    console.error("LOGIN ERROR:", error);

    message.textContent =
      "Login failed: " + error.code;

  }

});

</script>

</body>
</html>
