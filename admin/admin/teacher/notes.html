<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Rise Edge Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">Teacher Dashboard</a>
  <a href="../index.html">Home</a>
</header>

<main class="container">
  <h1>Study Notes</h1>

  <div class="card">
    <h2>Upload Notes</h2>

    <form id="notesForm">
      <input type="text" id="noteTitle" placeholder="Note title" required>

      <textarea id="noteDescription"
        rows="5"
        placeholder="Write a short description..."
        required></textarea>

      <button class="btn" type="submit">Save Note</button>
    </form>

    <p id="notesMessage"></p>
  </div>

  <div class="card">
    <h2>My Notes</h2>
    <div id="notesList">No notes uploaded yet.</div>
  </div>
</main>

<script type="module" src="../js/teacher.js"></script>

</body>
</html>
