<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices - Rise Edge Academy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">Admin Dashboard</a>
  <a href="../index.html">Home</a>
</header>

<main class="container">
  <h1>Notices</h1>

  <div class="card">
    <h2>Create Notice</h2>

    <form id="noticeForm">
      <input id="noticeTitle" type="text" placeholder="Notice title" required>

      <textarea id="noticeText"
        placeholder="Write your notice..."
        rows="6"
        required></textarea>

      <button class="btn" type="submit">
        Publish Notice
      </button>
    </form>

    <p id="noticeMessage"></p>
  </div>

  <div class="card">
    <h2>Published Notices</h2>
    <div id="noticesList">
      Loading notices...
    </div>
  </div>
</main>

<script type="module" src="../js/notices.js"></script>
</body>
</html>
