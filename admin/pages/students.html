<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Rise Edge Academy</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        .students-page {
            max-width: 1400px;
            margin: auto;
        }

        .students-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .students-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .students-header p {
            margin: 6px 0 0;
            color: #64748b;
        }

        .back-btn {
            border: 0;
            background: #111827;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .student-toolbar {
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15,23,42,.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .student-toolbar input,
        .student-toolbar select {
            flex: 1;
            min-width: 180px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 13px;
            outline: none;
            background: white;
        }

        .student-toolbar input:focus,
        .student-toolbar select:focus {
            border-color: #2563eb;
        }

        .student-count {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .students-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15,23,42,.06);
            overflow: hidden;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eef2f7;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .student-name {
            font-weight: 700;
            color: #172033;
        }

        .student-id {
            color: #64748b;
            font-size: 12px;
            margin-top: 3px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-suspended {
            background: #fef3c7;
            color: #92400e;
        }

        .status-released {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .action-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 11px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
        }

        .view-btn {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .edit-btn {
            background: #f1f5f9;
            color: #334155;
        }

        .empty-state {
            padding: 55px 20px;
            text-align: center;
            color: #64748b;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .students-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .students-header h1 {
                font-size: 23px;
            }

            .back-btn {
                width: 100%;
            }

            .student-toolbar {
                padding: 14px;
            }

            .student-toolbar input,
            .student-toolbar select {
                width: 100%;
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="main-content students-page">

    <!-- HEADER -->
    <div class="students-header">

        <div>
            <h1>👨‍🎓 Student Management</h1>
            <p>Manage Rise Edge Academy students.</p>
        </div>

        <button
            class="back-btn"
            onclick="window.location.href='../index.html'"
        >
            ← Back to Dashboard
        </button>

    </div>


    <!-- TOOLBAR -->
    <div class="student-toolbar">

        <input
            type="search"
            id="studentSearch"
            placeholder="Search by name, ID, email or phone..."
        >

        <select id="statusFilter">
            <option value="all">All Status</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="released">Released</option>
        </select>

        <select id="classFilter">
            <option value="all">All Classes</option>
        </select>

        <div class="student-count">
            Students: <span id="studentCount">0</span>
        </div>

    </div>


    <!-- STUDENTS -->
    <div class="students-card">

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Roll</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Admission Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentsTableBody">

                    <tr>
                        <td colspan="8">
                            <div class="loading">
                                Loading students...
                            </div>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script type="module" src="./js/students.js"></script>

</body>
</html>
