<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students | Rise Edge Academy</title>

    <link rel="stylesheet" href="../css/students.css">
</head>

<body>

<div class="students-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="students-header">

        <div class="students-header-left">

            <a
                href="../index.html"
                class="back-btn"
            >
                ←
            </a>

            <div>

                <span class="eyebrow">
                    RISE EDGE ACADEMY
                </span>

                <h1>
                    Student Management
                </h1>

                <p>
                    View, search and manage all registered students.
                </p>

            </div>

        </div>

    </header>


    <!-- =========================
         TOOLBAR
    ========================== -->

    <section class="students-toolbar">

        <div class="search-container">

            <span>⌕</span>

            <input
                type="search"
                id="studentSearch"
                placeholder="Search name, student ID, phone or email..."
                autocomplete="off"
            >

        </div>


        <div class="student-filters">

            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="active">
                    Active
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="released">
                    Released
                </option>

                <option value="inactive">
                    Inactive
                </option>

            </select>


            <select id="classFilter">

                <option value="all">
                    All Classes
                </option>

            </select>

        </div>

    </section>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="students-summary">

        <div>

            <h2>
                All Students
            </h2>

        </div>

        <span>
            Showing
            <strong id="studentCount">0</strong>
            students
        </span>

    </div>


    <!-- =========================
         TABLE CARD
    ========================== -->

    <section class="students-card">

        <div class="students-table-container">

            <table class="students-table">

                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Student ID
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Section
                        </th>

                        <th>
                            Roll
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Admission Date
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="studentsTableBody">

                    <tr>

                        <td colspan="9">

                            <div class="loading-state">

                                <div class="loader"></div>

                                <h3>
                                    Loading students...
                                </h3>

                                <p>
                                    Please wait.
                                </p>

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>


<!-- =====================================================
     STUDENT VIEW MODAL
===================================================== -->

<div
    class="student-modal"
    id="studentModal"
>

    <div class="student-modal-box">

        <!-- MODAL HEADER -->

        <div class="student-modal-header">

            <div>

                <span class="modal-eyebrow">
                    STUDENT PROFILE
                </span>

                <h2>
                    Student Details
                </h2>

            </div>


            <button
                type="button"
                class="modal-close-btn"
                id="closeStudentModal"
            >
                ×
            </button>

        </div>


        <!-- PROFILE -->

        <div
            class="student-modal-profile"
            id="studentModalProfile"
        >
        </div>


        <!-- BODY -->

        <div
            class="student-modal-body"
            id="studentModalBody"
        >
        </div>


        <!-- FOOTER -->

        <div class="student-modal-footer">

            <button
                type="button"
                class="modal-footer-close"
                id="closeStudentModalFooter"
            >
                Close
            </button>

        </div>

    </div>

</div>


<script
    type="module"
    src="../js/students.js"
></script>

</body>

</html>
