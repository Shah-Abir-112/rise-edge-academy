<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Rise Edge Academy</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        .students-page {
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }

        .students-header {
            margin-bottom: 25px;
        }

        .students-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .students-header p {
            margin: 0;
            color: #777;
        }

        .student-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .student-toolbar input,
        .student-toolbar select {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .student-toolbar input {
            flex: 1;
            min-width: 240px;
        }

        .student-count {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .students-table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border-radius: 12px;
        }

        .students-table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
        }

        .students-table th,
        .students-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: middle;
        }

        .students-table th {
            background: #f7f7f7;
            color: #555;
            font-size: 13px;
        }

        .students-table td {
            font-size: 14px;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .student-name {
            font-weight: 600;
        }

        .student-id {
            margin-top: 3px;
            font-size: 12px;
            color: #888;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-active {
            background: #e7f7ed;
            color: #16803c;
        }

        .status-pending {
            background: #fff4d6;
            color: #9a6a00;
        }

        .status-released {
            background: #f3e8e8;
            color: #a33a3a;
        }

        .status-inactive {
            background: #eee;
            color: #666;
        }

        .action-btn {
            border: none;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .view-btn {
            background: #222;
            color: white;
        }

        .status-btn {
            background: #eee;
            color: #333;
        }

        .empty-state,
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #b42318;
        }

        @media (max-width: 600px) {
            .students-page {
                padding: 15px;
            }

            .students-header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="students-page">

        <div class="students-header">
            <h1>Students Management</h1>
            <p>View and manage all registered students.</p>
        </div>


        <div class="student-toolbar">

            <input
                type="text"
                id="studentSearch"
                placeholder="Search by name, UID, phone or email..."
            >

            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="pending">Pending</option>
                <option value="released">Released</option>
                <option value="inactive">Inactive</option>
            </select>

            <select id="classFilter">
                <option value="all">All Classes</option>
            </select>

        </div>


        <div class="student-count">
            Showing <strong id="studentCount">0</strong> students
        </div>


        <div class="students-table-wrapper">

            <table class="students-table">

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Roll</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Admission Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentsTableBody">

                    <tr>
                        <td colspan="8">
                            <div class="loading">
                                Loading students...
                            </div>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script type="module" src="../js/students.js"></script>

</body>

</html>
