<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Students — Rise Edge Academy</title><link rel="stylesheet" href="../css/admin.css"><style>
body{background:#f5f7fb}.students-wrap{max-width:1400px;margin:auto}.back{display:inline-block;margin-bottom:16px;color:#334155;text-decoration:none}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.head h1{margin:0}.head p{color:#64748b;margin:5px 0}.student-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.box,.toolbar,.table-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(15,23,42,.06)}.box{padding:18px}.box span{font-size:13px;color:#64748b}.box strong{display:block;font-size:25px;margin-top:6px}.toolbar{padding:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select,.modal input,.modal select{width:100%;padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;background:#fff}.table-card{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf1f5;font-size:13px}.table th{color:#64748b;background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:capitalize}.active{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.released{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:12px}.view{background:#e0e7ff;color:#3730a3}.activate{background:#dcfce7;color:#166534}.release{background:#fee2e2;color:#991b1b}.edit{background:#e0f2fe;color:#075985}.empty{text-align:center;padding:35px;color:#64748b}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;padding:20px;overflow:auto}.modal-backdrop.show{display:flex;align-items:center;justify-content:center}.modal{width:min(680px,100%);background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;border-radius:9px;padding:8px 11px;cursor:pointer}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.details-grid div{background:#f8fafc;padding:12px;border-radius:10px}.details-grid span{font-size:11px;color:#64748b;display:block}.details-grid strong{display:block;margin-top:5px;word-break:break-word}.edit-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edit-form label{font-size:12px;color:#475569}.edit-form input,.edit-form select{margin-top:5px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.save{background:#111827;color:#fff}.cancel{background:#e2e8f0;color:#1e293b}@media(max-width:900px){.student-stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.student-stats,.toolbar,.details-grid,.edit-form{grid-template-columns:1fr}.head{display:block}}
</style></head><body><main class="main" style="margin-left:0"><div class="students-wrap"><a class="back" href="../index.html">← Back to Admin Dashboard</a><div class="head"><div><h1>Students Management</h1><p>Manage student accounts, status and academic identity.</p></div></div><div class="student-stats"><div class="box"><span>Total Students</span><strong id="studentTotal">0</strong></div><div class="box"><span>Active</span><strong id="studentActive">0</strong></div><div class="box"><span>Pending</span><strong id="studentPending">0</strong></div><div class="box"><span>Released</span><strong id="studentReleased">0</strong></div></div><div class="toolbar"><input id="studentSearch" placeholder="Search name, email or student ID"><select id="statusFilter"><option value="all">All Status</option><option value="active">Active</option><option value="pending">Pending</option><option value="released">Released</option></select><select id="classFilter"><option value="all">All Classes</option></select><select id="sectionFilter"><option value="all">All Sections</option></select></div><div class="table-card"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Student ID</th><th>Class</th><th>Section</th><th>Status</th><th>Actions</th></tr></thead><tbody id="studentsTableBody"><tr><td colspan="7" class="empty">Loading students...</td></tr></tbody></table></div></div></main><div id="studentModal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Student Details</h2><button class="close" id="closeStudentModal">✕</button></div><div id="studentDetails"></div></div></div><script type="module" src="../js/students.js"></script></body></html>
