<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Rise Edge Academy</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        .students-page {
            max-width: 1400px;
            margin: auto;
        }

        .students-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .students-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .students-header p {
            margin: 6px 0 0;
            color: #64748b;
        }

        .back-btn {
            border: 0;
            background: #111827;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .student-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15,23,42,.06);
        }

        .stat-card span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-card strong {
            font-size: 27px;
            color: #172033;
        }

        .student-toolbar {
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15,23,42,.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .student-toolbar input,
        .student-toolbar select {
            flex: 1;
            min-width: 170px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 13px;
            outline: none;
            background: white;
        }

        .student-toolbar input:focus,
        .student-toolbar select:focus {
            border-color: #2563eb;
        }

        .student-count {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .students-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15,23,42,.06);
            overflow: hidden;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #eef2f7;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .student-name {
            font-weight: 700;
            color: #172033;
        }

        .student-id {
            color: #64748b;
            font-size: 12px;
            margin-top: 3px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-suspended {
            background: #fef3c7;
            color: #92400e;
        }

        .status-released {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-pending {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-unknown {
            background: #f1f5f9;
            color: #475569;
        }

        .action-btn {
            border: 0;
            border-radius: 8px;
            padding: 8px 11px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
        }

        .view-btn {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .edit-btn {
            background: #f1f5f9;
            color: #334155;
        }

        .release-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        .activate-btn {
            background: #dcfce7;
            color: #166534;
        }

        .empty-state,
        .loading {
            padding: 55px 20px;
            text-align: center;
            color: #64748b;
        }

        /* MODAL */

        .student-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999
