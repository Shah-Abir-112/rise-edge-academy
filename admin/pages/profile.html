<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Profile | Rise Edge Academy"><link rel="stylesheet" href="../css/admin.css"><style>
.profile-card{max-width:760px}.profile-head{display:flex;gap:18px;align-items:center;margin-bottom:22px}.profile-avatar{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:#e6fffb;color:#0f766e;font-size:30px;font-weight:800;overflow:hidden}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-field{display:flex;flex-direction:column;gap:7px}.profile-field.full{grid-column:1/-1}.profile-field label{font-size:13px;font-weight:700;color:#475569}.profile-field input,.profile-field textarea{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;background:#fff}.profile-field input[readonly]{background:#f8fafc;color:#64748b}.profile-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.profile-message{margin-top:14px;padding:11px 13px;border-radius:10px;display:none}.profile-message.ok{display:block;background:#ecfdf5;color:#047857}.profile-message.err{display:block;background:#fef2f2;color:#b91c1c}@media(max-width:700px){.profile-grid{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-head{align-items:flex-start}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="side-brand"><span class="side-mark">R</span>Rise Edge Academy</div><nav class="nav"><a href="../index.html">← Dashboard</a><a href="profile.html" class="active">Admin Profile</a><a href="admissions.html">Admissions</a><a href="students.html">Students</a><a href="teachers.html">Teachers</a><a href="classes.html">Classes</a><a href="attendance.html">Attendance</a><a href="fees.html">Fees</a><a href="salaries.html">Salaries</a><a href="notices.html">Notices</a><a href="messages.html">Messages</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a href="activity-log.html">Activity Log</a><a href="../../login.html" id="logoutLink">Logout</a></nav></aside><section class="main"><header class="topbar"><h1>Admin Profile</h1><div class="user-chip"><span id="topName">Admin</span><div class="avatar" id="topAvatar">A</div></div></header><main class="content"><div class="page-head"><div><span class="eyebrow">ACCOUNT</span><h2>Admin Profile</h2><p class="muted">Edit your administrator profile information.</p></div></div><div class="panel profile-card"><div class="profile-head"><div class="profile-avatar" id="profileAvatar">A</div><div><h3 id="profileName">Loading…</h3><p class="muted" id="profileEmail">Loading…</p></div></div><form id="profileForm"><div class="profile-grid"><div class="profile-field"><label>Admin ID</label><input id="adminId" readonly></div><div class="profile-field"><label>Email</label><input id="email" type="email" readonly></div><div class="profile-field"><label>Full Name</label><input id="name" required maxlength="80"></div><div class="profile-field"><label>Phone</label><input id="phone" maxlength="30"></div><div class="profile-field full"><label>Address</label><textarea id="address" rows="3" maxlength="300"></textarea></div><div class="profile-field full"><label>Profile Photo URL (optional)</label><input id="profilePicture" type="url" placeholder="https://..."></div></div><div class="profile-actions"><a class="btn btn-light" href="../index.html">Cancel</a><button class="btn btn-primary" id="saveBtn" type="submit">Save Changes</button></div><div id="message" class="profile-message"></div></form></div></main></section></div><script type="module" src="../js/profile.js"></script></body></html>
